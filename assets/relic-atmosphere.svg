    <circle cx="178" cy="208" r="1.6" opacity=".44"/><circle cx="250" cy="356" r="1.1" opacity=".33"/>
    <circle cx="338" cy="145" r="1.2" opacity=".42"/><circle cx="422" cy="270" r="1.5" opacity=".35"/>
    <circle cx="520" cy="190" r="1" opacity=".34"/><circle cx="606" cy="118" r="1.4" opacity=".46"/>
    <circle cx="742" cy="222" r="1.2" opacity=".40"/><circle cx="874" cy="142" r="1.4" opacity=".50"/>
    <circle cx="1018" cy="250" r="1" opacity=".36"/><circle cx="1240" cy="184" r="1.4" opacity=".44"/>
