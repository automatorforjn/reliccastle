<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10253a" stop-opacity=".82"/>
      <stop offset=".45" stop-color="#0a1724" stop-opacity=".68"/>
      <stop offset="1" stop-color="#03070d" stop-opacity=".18"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="70%" cy="14%" r="24%">
      <stop offset="0" stop-color="#f4e8c8" stop-opacity=".18"/>
      <stop offset=".3" stop-color="#d8b675" stop-opacity=".07"/>
      <stop offset="1" stop-color="#d8b675" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dune" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8c6334" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#d8b675" stop-opacity=".07"/>
      <stop offset="1" stop-color="#25190f" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="goldRail" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#d8b675" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f1d59b" stop-opacity=".34"/>
      <stop offset="1" stop-color="#d8b675" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur24"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#moonGlow)"/>

  <circle cx="1135" cy="120" r="54" fill="#f1eadc" opacity=".12"/>
  <circle cx="1135" cy="120" r="92" fill="#f1d59b" opacity=".025" filter="url(#blur24)"/>

  <!-- distant desert haze -->
  <ellipse cx="760" cy="655" rx="720" ry="115" fill="#d8b675" opacity=".045" filter="url(#blur24)"/>

  <!-- stepped desert dunes -->
  <path d="M0 676C176 614 320 644 468 603C650 553 751 601 910 578C1097 550 1254 585 1600 512V900H0Z" fill="url(#dune)"/>
  <path d="M0 740C196 688 334 717 520 668C704 620 848 684 1035 642C1226 600 1395 646 1600 590V900H0Z" fill="#130e0a" opacity=".30"/>

