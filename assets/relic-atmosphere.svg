<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10263c" stop-opacity=".46"/>
      <stop offset=".56" stop-color="#09131f" stop-opacity=".20"/>
      <stop offset="1" stop-color="#03070d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#d8b675" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f1d59b" stop-opacity=".30"/>
      <stop offset="1" stop-color="#d8b675" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- distant moon / horizon glow -->
  <circle cx="1120" cy="120" r="64" fill="#f1eadc" opacity=".05"/>
  <ellipse cx="800" cy="700" rx="740" ry="120" fill="#d8b675" opacity=".025" filter="url(#soft)"/>

  <!-- distant castle / ruin skyline -->
  <g fill="#06101a" opacity=".82">
    <path d="M0 552H92v-98h32v-54h46v44h26v108h72v-136h34v-58h50v72h24v122h76v-96h44v96h68v-158h30v-72h42v58h22v172h86v-118h34v-46h54v64h26v100h72v-142h34v-66h44v48h22v160h78v-96h46v96h94v348H0Z"/>
    <path d="M230 552v-52l46-44 46 44v52Zm848 0v-62l52-54 52 54v62Z" opacity=".72"/>
  </g>

  <!-- broken foreground ruins -->
  <g fill="#050b12" opacity=".74">
    <path d="M0 760h155l26-92 28 12 16-57 32 8 20-92 28 6 34 215H0Z"/>
    <path d="M1600 760h-168l-28-84-26 14-18-62-28 7-18-94-31 8-25 211h342Z"/>
  </g>

  <!-- gold architectural horizon rails -->
  <g fill="none" stroke="#d8b675" opacity=".13">
    <path d="M80 648H1520"/>
    <path d="M180 676H1420" stroke="url(#gold)"/>
  </g>

  <!-- sparse sand / star particles -->
  <g fill="#d8b675">
    <circle cx="120" cy="134" r="1.5" opacity=".50"/><circle cx="210" cy="270" r="1" opacity=".28"/>
    <circle cx="340" cy="112" r="1.2" opacity=".44"/><circle cx="452" cy="208" r="1.4" opacity=".32"/>
    <circle cx="610" cy="142" r="1" opacity=".42"/><circle cx="744" cy="96" r="1.5" opacity=".36"/>
    <circle cx="892" cy="180" r="1.1" opacity=".40"/><circle cx="1018" cy="88" r="1.4" opacity=".48"/>
    <circle cx="1214" cy="218" r="1" opacity=".34"/><circle cx="1380" cy="120" r="1.5" opacity=".46"/>
    <circle cx="1484" cy="310" r="1" opacity=".32"/><circle cx="126" cy="630" r="1.5" opacity=".34"/>
    <circle cx="290" cy="704" r="1" opacity=".28"/><circle cx="470" cy="650" r="1.2" opacity=".38"/>
    <circle cx="684" cy="736" r="1.5" opacity=".30"/><circle cx="914" cy="690" r="1" opacity=".34"/>
    <circle cx="1130" cy="728" r="1.3" opacity=".32"/><circle cx="1394" cy="664" r="1.6" opacity=".38"/>
  </g>

  <!-- two restrained crystal silhouettes -->
  <g fill="none" stroke="#d8b675" opacity=".16">
    <path d="M118 752l28-92 30 92-30 34Z"/><path d="M146 660v126"/>
    <path d="M1432 766l22-74 24 74-24 28Z"/><path d="M1454 692v102"/>
  </g>
</svg>
