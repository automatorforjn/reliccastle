    <circle cx="470" cy="642" r="1.6" opacity=".38"/><circle cx="662" cy="728" r="1.4" opacity=".30"/>
    <circle cx="864" cy="676" r="1.6" opacity=".32"/><circle cx="1088" cy="740" r="1.2" opacity=".34"/>
    <circle cx="1260" cy="664" r="1.8" opacity=".32"/><circle cx="1422" cy="724" r="1.4" opacity=".38"/>
